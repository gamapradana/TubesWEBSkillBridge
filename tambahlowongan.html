<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>SkillBridge - Tambah Lowongan</title>
</head>
<body>

    <header>
        <h1>SkillBridge</h1>

        <nav>
            <a href="index.html">Lowongan</a>
            <a href="tambah.html">Tambah Lowongan</a>
        </nav>
    </header>

    <main>
        <article>
            <h2>Tambah Lowongan</h2>

            <form>
                <label for="posisi">Posisi:</label>
                <input type="text" id="posisi" name="posisi">

                <br><br>

                <label for="perusahaan">Perusahaan:</label>
                <input type="text" id="perusahaan" name="perusahaan">

                <br><br>

                <label for="lokasi">Lokasi:</label>
                <input type="text" id="lokasi" name="lokasi">

                <br><br>

                <label for="tipe">Tipe Pekerjaan:</label>
                <select id="tipe" name="tipe">
                    <option value="fulltime">Full Time</option>
                    <option value="parttime">Part Time</option>
                    <option value="internship">Internship</option>
                </select>

                <br><br>

                <label for="deskripsi">Deskripsi:</label>
                <br>
                <textarea id="deskripsi" name="deskripsi" rows="5" cols="30"></textarea>

                <br><br>

                <button type="submit">Simpan</button>
            </form>
        </article>
    </main>

    <footer>
        <p>&copy; 2026 SkillBridge</p>
    </footer>

</body>
</html>
