
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillBridge - Tambah Lowongan</title>

    <link rel="stylesheet" href="style.css">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">
                SkillBridge
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu"
                aria-controls="navbarMenu"
                aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">
                            Dashboard
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Daftar Lowongan
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active"
                           aria-current="page"
                           href="tambah.html">
                            Tambah Lowongan
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    
    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-7">

                <div class="card shadow-sm">
                    <div class="card-body p-4">

                        <h1 class="h3 mb-2">Tambah Lowongan</h1>

                        <p class="text-secondary mb-4">
                            Lengkapi informasi untuk menambahkan lowongan pekerjaan.
                        </p>

                        <form>
                            
                            <div class="mb-3">
                                <label for="posisi" class="form-label">
                                    Posisi Pekerjaan
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="posisi"
                                    name="posisi"
                                    placeholder="Contoh: Backend Developer"
                                    required>
                            </div>

                            
                            <div class="mb-3">
                                <label for="perusahaan" class="form-label">
                                    Nama Perusahaan
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="perusahaan"
                                    name="perusahaan"
                                    placeholder="Masukkan nama perusahaan"
                                    required>
                            </div>

                            
                            <div class="mb-3">
                                <label for="lokasi" class="form-label">
                                    Lokasi
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="lokasi"
                                    name="lokasi"
                                    placeholder="Contoh: Bandung"
                                    required>
                            </div>

                            
                            <div class="mb-3">
                                <label for="tipe" class="form-label">
                                    Tipe Pekerjaan
                                </label>

                                <select
                                    class="form-select"
                                    id="tipe"
                                    name="tipe"
                                    required>

                                    <option value="" selected disabled>
                                        Pilih tipe pekerjaan
                                    </option>

                                    <option value="fulltime">Full Time</option>
                                    <option value="parttime">Part Time</option>
                                    <option value="internship">Internship</option>
                                </select>
                            </div>

                            
                            <div class="mb-4">
                                <label for="deskripsi" class="form-label">
                                    Deskripsi Pekerjaan
                                </label>

                                <textarea
                                    class="form-control"
                                    id="deskripsi"
                                    name="deskripsi"
                                    rows="5"
                                    placeholder="Jelaskan tanggung jawab dan kualifikasi pekerjaan..."
                                    required></textarea>
                            </div>

                            
                            <div class="d-flex gap-2">
                                <button
                                    type="submit"
                                    class="btn btn-primary">
                                    Simpan Lowongan
                                </button>

                                <a
                                    href="index.html"
                                    class="btn btn-outline-secondary">
                                    Batal
                                </a>
                            </div>
                        </form>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer class="bg-light text-center py-3 mt-4">
        <p class="mb-0">&copy; 2026 SkillBridge</p>
    </footer>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
